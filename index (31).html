<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signia Sales Console</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#0f1a2b;--rail:#0b1523;--acc:#b3122c;--acc-d:#8f0d22;--tx:#1b2536;--tx2:#4a566a;--tx3:#7a869a;--bd:#dfe4ec;--bd2:#eef1f6;--bg:#f4f6f9;--sf:#fff;--ok:#0d7a4f;--sh:0 1px 2px rgba(15,26,43,.06),0 4px 14px rgba(15,26,43,.05)}
body{font:13.5px/1.5 Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.rail{background:var(--rail);color:#c5cddb;display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh}
.brand{padding:0 8px 22px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:18px}
.brand b{display:block;color:#fff;font-size:17px;letter-spacing:.22em;font-weight:700}
.brand span{font-size:11px;color:#8794a9;letter-spacing:.04em}
.nav-h{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6b7891;padding:0 10px 8px}
.nav{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;color:#c5cddb;padding:9px 10px;font-weight:500;border-radius:0 6px 6px 0}
.nav:hover{background:rgba(255,255,255,.05);color:#fff}
.nav.on{background:rgba(255,255,255,.08);color:#fff;border-left-color:var(--acc)}
.nav small{float:right;color:#7d8aa1;font-weight:500}
.rail-f{margin-top:auto;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#8794a9}
.st{display:flex;align-items:center;gap:7px;margin-bottom:10px;color:#c5cddb;font-weight:500}
.st i{width:7px;height:7px;border-radius:50%;background:#7d8aa1}
.st.live i{background:#2fb47c}.st.cached i{background:#d9a03a}.st.error i{background:#e0475b}
.rail-f button{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#dbe1ec;border-radius:6px;padding:7px;margin-top:6px;font-weight:500}
.rail-f button:hover{background:rgba(255,255,255,.12)}
main{min-width:0;padding:26px 34px 110px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:22px;font-weight:650;letter-spacing:-.01em;color:var(--ink)}
.top p{color:var(--tx3);font-size:12.5px;margin-top:2px}
.search{width:340px;max-width:100%;height:40px;border:1px solid var(--bd);border-radius:8px;padding:0 14px;background:var(--sf)}
.search:focus,select:focus,textarea:focus,input:focus{outline:2px solid rgba(179,18,44,.25);border-color:var(--acc)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);background:var(--sf);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh);margin-bottom:16px}
.m{padding:14px 18px;border-right:1px solid var(--bd2)}.m:last-child{border:0}
.m span{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--tx3);font-weight:600}
.m b{display:block;font-size:20px;font-weight:650;color:var(--ink);margin-top:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select{height:36px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);padding:0 10px}
.spacer{margin-left:auto}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--sf)}
.seg button{border:0;background:none;padding:0 14px;height:34px;font-weight:500;color:var(--tx2)}
.seg button.on{background:var(--ink);color:#fff}
.count{font-size:12px;color:var(--tx3);margin-bottom:12px}.count b{color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:#c2cad8;box-shadow:0 2px 4px rgba(15,26,43,.06),0 10px 26px rgba(15,26,43,.08)}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.img{height:170px;background:linear-gradient(#f7f8fb,#eceff4);display:flex;align-items:center;justify-content:center;cursor:pointer}
.img img{max-width:80%;max-height:145px;object-fit:contain;mix-blend-mode:multiply}
.ph{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:600}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}
.ser{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:650;color:var(--acc)}
.nm{font-size:15.5px;font-weight:650;color:var(--ink);margin:3px 0 10px;line-height:1.3;cursor:pointer}
.sp{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--bd2);border-radius:8px;margin-bottom:10px}
.sp div{padding:7px 10px;font-weight:550;font-size:12.5px}.sp div:nth-child(odd){border-right:1px solid var(--bd2)}.sp div:nth-child(n+3){border-top:1px solid var(--bd2)}
.sp small,.lbl{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;min-height:22px}
.tags span{font-size:11px;background:var(--bg);border:1px solid var(--bd2);border-radius:5px;padding:2px 7px;color:var(--tx2)}
.ft{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;padding-top:12px;border-top:1px solid var(--bd2)}
.pr{font-size:20px;font-weight:700;color:var(--ink)}
.acts{display:flex;gap:6px;margin-top:12px}
.btn{height:34px;padding:0 13px;border:1px solid var(--bd);background:var(--sf);border-radius:7px;font-weight:550;color:var(--tx)}
.btn:hover{border-color:#aeb8c9;background:#fafbfd}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.p:hover{background:var(--acc-d)}
.btn.on{background:#fdf0f2;border-color:var(--acc);color:var(--acc)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.acts .btn{flex:1}
.list{background:var(--sf);border:1px solid var(--bd);border-radius:10px;overflow:hidden;box-shadow:var(--sh)}
.row{display:grid;grid-template-columns:2.6fr 1fr .8fr 1fr 1fr 190px;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--bd2)}
.row:last-child{border:0}.row.h{background:#f8f9fb;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--tx3);font-weight:650}
.row .acts{margin:0}.row strong{display:block;color:var(--ink)}
.empty{background:var(--sf);border:1px dashed var(--bd);border-radius:10px;padding:56px 20px;text-align:center;color:var(--tx3)}
.empty p{color:var(--tx);font-weight:550;margin-bottom:6px}
.tray{position:fixed;left:236px;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--bd);box-shadow:0 -6px 24px rgba(15,26,43,.08);padding:12px 34px;display:none;align-items:center;gap:14px;z-index:20}
.tray.show{display:flex}
.tray b{white-space:nowrap}
.slots{display:flex;gap:8px;flex:1;overflow:auto}
.slot{background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:6px 10px;white-space:nowrap;font-size:12.5px;font-weight:550}
.slot button{border:0;background:none;color:var(--tx3);margin-left:8px;font-size:15px;line-height:1}
.ov{position:fixed;inset:0;background:rgba(11,21,35,.6);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--sf);border-radius:12px;width:100%;max-width:960px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(11,21,35,.35);overflow:hidden}
.modal.ws{max-width:1320px;height:92vh}
.mh{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 24px;border-bottom:1px solid var(--bd)}
.mt{font-size:18px;font-weight:650;color:var(--ink)}.ms{color:var(--tx3);font-size:12.5px}
.x{border:0;background:none;font-size:20px;color:var(--tx3);width:30px;height:30px;border-radius:6px}.x:hover{background:var(--bg)}
.mb{padding:22px 24px;overflow:auto;flex:1}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;margin-bottom:20px}
.hero .img{height:230px;border-radius:10px;cursor:default}.hero .img img{max-height:200px}
.big{font-size:32px;font-weight:700;color:var(--ink);margin:2px 0 14px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.sg div{border:1px solid var(--bd2);background:#fafbfd;border-radius:8px;padding:10px 12px;font-weight:600}
.sec{margin-bottom:18px}.sec h4,.sh{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);font-weight:650;margin-bottom:8px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills span{border:1px solid var(--bd);border-radius:6px;padding:4px 9px;font-size:12px;background:#fff}
.pills em{color:var(--tx3);font-style:normal;margin-left:6px;font-size:11px}
.acc{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.acc div{border:1px solid var(--bd2);border-radius:8px;padding:9px 12px;background:#fafbfd}.acc strong{display:block;font-size:12.5px}.acc span{color:var(--tx2);font-size:12px}
.note{background:#f8f9fb;border-left:3px solid var(--ink);border-radius:0 8px 8px 0;padding:12px 14px;color:var(--tx2)}
.src{color:var(--tx3);font-size:11.5px;margin-top:14px}
.wb{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 24px;border-bottom:1px solid var(--bd);background:#fafbfd;flex-wrap:wrap}
.wt{display:flex;gap:2px}.wt button{border:0;background:none;padding:8px 14px;font-weight:550;color:var(--tx2);border-bottom:2px solid transparent}
.wt button.on{color:var(--acc);border-color:var(--acc)}
.wa{display:flex;gap:8px}
.wp{display:none}.wp.on{display:block}
.ctl{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:14px;font-size:12.5px}
.ctl input[type=text]{height:34px;border:1px solid var(--bd);border-radius:7px;padding:0 10px;margin-left:6px}
.chip{border:1px solid var(--bd);background:#fff;border-radius:16px;padding:4px 12px;font-size:12px;font-weight:550;color:var(--tx2);margin-left:5px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tw{border:1px solid var(--bd);border-radius:10px;overflow:auto;max-height:52vh}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 14px;border-bottom:1px solid var(--bd2);text-align:left;font-size:12.5px;min-width:150px}
thead th{position:sticky;top:0;background:#fff;z-index:2;border-bottom:1px solid var(--bd);vertical-align:top}
th:first-child,td:first-child{position:sticky;left:0;background:#fff;min-width:210px;z-index:1;font-weight:550}
thead th:first-child{z-index:3}
.g td{background:#f3f5f9!important;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx2);font-weight:650}
.ph1{color:var(--acc);font-weight:700;font-size:15px;display:block;margin-top:2px}
.y{color:var(--ok);font-weight:650}.n{color:#a3adbd}
.pl{display:grid;grid-template-columns:1fr 300px;gap:18px}
textarea{width:100%;min-height:400px;border:1px solid var(--bd);border-radius:8px;padding:14px;line-height:1.6;resize:vertical}
.side{background:#f8f9fb;border:1px solid var(--bd2);border-radius:10px;padding:14px}
.side div.i{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd2);font-size:12.5px}
.snap{max-width:900px;margin:0 auto;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:34px}
.snap .lg{display:flex;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:22px}
.snap .lg b{letter-spacing:.24em;font-size:16px;color:var(--acc)}.snap .lg span{color:var(--tx3);font-size:12px}
.snap h2{font-size:26px;color:var(--ink)}.snap .sb{color:var(--tx3);margin-bottom:18px}
.sprod{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;margin-bottom:18px}
.sprod div{border:1px solid var(--bd);border-radius:8px;padding:12px}.sprod b{display:block;color:var(--acc);font-size:17px}.sprod span{font-size:12px;color:var(--tx3)}
.snap table th,.snap table td{min-width:0;position:static}
.snap .np{margin-top:18px;background:#f8f9fb;border-radius:8px;padding:14px;color:var(--tx2)}
.snap .fo{margin-top:16px;font-size:11px;color:var(--tx3)}
.reco{max-width:1100px}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--sh)}
.panel .chip{margin:0 6px 6px 0;padding:6px 14px}
details{background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;box-shadow:var(--sh)}
summary{padding:14px 18px;font-weight:600;cursor:pointer;color:var(--ink)}
details .a{padding:0 18px 16px;color:var(--tx2)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;z-index:99;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.warn{background:#8a5a0a}.toast.success{background:#0d5c3d}
.saved{display:flex;justify-content:space-between;width:100%;text-align:left;border:1px solid var(--bd);background:#fff;border-radius:8px;padding:12px 14px;margin-bottom:8px}
.saved:hover{border-color:#aeb8c9;background:#fafbfd}.saved span,.saved small{color:var(--tx3);font-size:12px;display:block}

body{background:radial-gradient(1100px 460px at 75% -8%,#e6ebf4,transparent 62%),var(--bg)}
.rail{background:linear-gradient(180deg,#0a1320,#101f36)}
.brand b:before{content:"";display:inline-block;width:9px;height:9px;background:var(--acc);border-radius:2px;margin-right:10px;vertical-align:1px}
.nav{transition:background .15s,color .15s}
.filters select{transition:border-color .15s}.filters select:hover{border-color:#aeb8c9}
.card{border-radius:12px;animation:up .4s ease both}.card:hover{transform:translateY(-3px)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.img{background:radial-gradient(circle at 50% 42%,#fff 0,#f1f4f8 60%,#e7ebf1)}.img .vis{width:78%;height:100%;max-height:158px}
.ser{display:inline-block;align-self:flex-start;padding:2px 9px;border-radius:10px;background:#fdf0f2}.pr{font-size:21px;letter-spacing:-.01em}
.nm:hover{color:var(--acc)}.row:not(.h):hover{background:#fafbfd}
.sk{animation:none}.sk .img,.sk i{background:linear-gradient(90deg,#eef1f6 25%,#f8f9fb 50%,#eef1f6 75%);background-size:200% 100%;animation:sh 1.3s infinite}
.sk i{display:block;height:12px;border-radius:6px;margin:14px 0}.sk i:nth-child(2){width:70%}.sk i:nth-child(3){width:45%}@keyframes sh{to{background-position:-200% 0}}
.tray{backdrop-filter:blur(8px);background:rgba(255,255,255,.94)}
.modal{border-radius:14px}.mh{background:linear-gradient(#fff,#fafbfd)}.hero .img{border:1px solid var(--bd2)}
.btn{transition:background .15s,border-color .15s,box-shadow .15s}.btn.p{box-shadow:0 2px 8px rgba(179,18,44,.25)}

body{font-size:13px}main{padding:22px 30px 100px}h1{font-size:20px}.top{margin-bottom:10px}
.metrics{display:flex;flex-wrap:wrap;gap:4px 26px;background:none;border:0;box-shadow:none;border-radius:0;margin:0 0 14px}
.m{padding:0;border:0;display:flex;gap:7px;align-items:baseline;min-width:0;box-shadow:none!important}
.m span{font-size:12px;text-transform:none;letter-spacing:0;font-weight:500}.m b{margin:0;font-size:12.5px;font-weight:650;overflow:visible}
.plat{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pc{height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--bd);background:#fff;color:var(--tx2);font-size:12px;font-weight:550}
.pc b{margin-left:8px;color:var(--tx3);font-weight:600}.pc:hover{border-color:#aeb8c9}.pc.on{background:var(--ink);border-color:var(--ink);color:#fff}.pc.on b{color:#9fb0c9}
.grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{animation:none;border-radius:8px;box-shadow:none}.card:hover{transform:none;box-shadow:var(--sh)}
.img{height:120px;background:#f6f7fa}.img img{max-height:100px}.hero.one{grid-template-columns:1fr}
.cb{padding:13px 14px}.nm{font-size:14px;margin-bottom:9px}.pr{font-size:17px}.sp div{padding:6px 9px}.tags{min-height:0}
.tw2{background:var(--sf);border:1px solid var(--bd);border-radius:8px;box-shadow:var(--sh)}
.dt{width:100%;border-collapse:collapse}
.dt th,.dt td{min-width:0;padding:9px 14px;text-align:left}
.dt th{position:sticky;top:0;z-index:5;background:#f7f8fb;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);font-weight:650;white-space:nowrap;border-bottom:1px solid var(--bd)}
.dt th:first-child{left:auto;min-width:0;z-index:5}.dt td:first-child{position:static;min-width:0;background:transparent;font-weight:inherit}
.dt th[data-s]{cursor:pointer}.dt th[data-s]:hover{color:var(--ink)}
.dt tbody tr{cursor:pointer}.dt tbody tr:hover{background:#f8f9fc}.dt tr.sel{background:#fdf3f5}
.dt td strong{display:block;color:var(--ink);font-weight:600}.dt .sub{font-size:11.5px;color:var(--tx3)}
.dt .ck{width:38px;padding-right:0}.dt .r,.dt td.pr2{text-align:right}.dt td.pr2{font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.dt .ra{text-align:right;white-space:nowrap}.lk{border:0;background:none;color:var(--acc);font-weight:600;font-size:12px;padding:4px 6px}.lk:hover{text-decoration:underline}
input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px}
@media(max-width:900px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px;align-items:center;gap:6px}.brand{border:0;padding:0 10px 0 0;margin:0}.nav-h,.rail-f{display:none}.nav{width:auto;border:0;border-radius:6px}main{padding:18px 14px 110px}.tray{left:0;padding:10px 14px}.metrics{grid-template-columns:1fr 1fr}.hero,.pl{grid-template-columns:1fr}.sg{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.row.h{display:none}.search{width:100%}}

/* ===== Classic layout (matches the layout consultants already know) ===== */
:root{--acc:#d0112b;--acc-d:#a80d22}
body{background:#fff}
.oh{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--bd2);background:#fff}
.ob{display:flex;align-items:center;gap:12px}
.ologo{width:30px;height:30px;border-radius:7px;background:var(--acc)}
.ot{font-size:15px;font-weight:700;color:var(--ink);line-height:1.2}
.os{font-size:11.5px;color:var(--tx3)}
.oright{display:flex;align-items:center;gap:10px}
.oh .st{margin:0;background:#e8f8f0;border:1px solid #86dbb4;color:#0d7a4f;border-radius:999px;padding:6px 14px;font-size:12px}
.oh .st.cached{background:#fff6e5;border-color:#efcf8a;color:#8a5a0a}
.oh .st.error{background:#fdecef;border-color:#f0a3ae;color:#a80d22}
.osq{width:34px;height:34px;border:1px solid var(--bd);background:#fff;border-radius:8px;font-size:16px;color:var(--tx2)}
.osq:hover{border-color:#aeb8c9}
.ow{padding:18px 24px 90px}
.otabs{display:inline-flex;align-items:center;gap:4px;background:#eef0f5;border-radius:12px;padding:5px;margin-bottom:16px}
.otabs .nav{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 18px;border-radius:9px;font-size:13px;font-weight:500;color:var(--tx2)}
.otabs .nav.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(15,26,43,.12)}
.osaved{border:0;background:none;color:var(--acc);font-weight:600;margin-left:14px;font-size:12.5px;cursor:pointer}

function familyMatch(fam,d){const f=norm(fam),n=norm(d.name),s=norm(d.series);if(!f)return false;for(const st of['styletto','pure','motion','silk','insio','active','intuis','orion','sirion'])if(n.includes(st)&&f.includes(st))return true;if(s&&f.includes(s))return true;return f.includes(n.slice(0,8))||n.includes(f.slice(0,8))}

function accOk(c,a){const n=norm(a.name),f=norm(a.form),ch=f.includes('charger');return(cflag(c,/(^|_)tv/)&&(n.includes('tv')||f.includes('streamer')))||(cflag(c,/mic/)&&n.includes('streamline')&&n.includes('mic'))||(cflag(c,/mini_?pocket/)&&n.includes('minipocket'))||(cflag(c,/portable/)&&ch&&n.includes('portable'))||(cflag(c,/inductive/)&&ch&&n.includes('inductive'))||(cflag(c,/desktop/)&&ch&&n.includes('desktop'))||(cflag(c,/dry/)&&ch&&n.includes('dry'))||(cflag(c,/multi/)&&ch&&n.includes('multi'))||(cflag(c,/cros/)&&(n.includes('cros')||n.includes('bicros')))}
function compatAcc(ds){if(!ds.length)return[];const fam=S.compat.filter(c=>ds.some(d=>familyMatch(c.family,d)));return fam.length?S.accessories.filter(a=>fam.some(c=>accOk(c,a))):[]}
function openDetail(id){const i=S.all.find(x=>x.id===id);if(!i)return;const acc=compatAcc([i]).slice(0,8);
 const secs=GROUPS.slice(1).map(g=>{const f=g.f.filter(([k])=>{const v=disp(i,k);return v==='✓'||v==='Optional'});return f.length?`<div class="sec"><h4>${g.label}</h4><div class="pills">${f.map(([k,l])=>`<span>${esc(l)}${disp(i,k)==='Optional'?'<em>Optional</em>':''}</span>`).join('')}</div></div>`:''}).join('');
 const o=openModal(`<div class="mh"><div><div class="ser">${esc(seriesLabel(i.series))}</div><div class="mt">${esc(i.name)}</div><div class="ms">${esc(i.form||'—')} · ${esc(i.channels||'—')} channels · ${i.fitting?esc(i.fitting)+' dB':'—'}</div></div><button class="x">×</button></div>
 <div class="mb"><div class="hero ${photoFor(i)?'':'one'}">${photoFor(i)?`<div class="img">${imgHtml(i)}</div>`:''}<div><span class="lbl">MRP</span><div class="big">${money(i.price)}</div><div class="acts"><button class="btn p" id="d-cmp">${inCmp(i.id)?'Remove from comparison':'Add to comparison'}</button><button class="btn" id="d-pitch">Copy pitch</button></div></div></div>
 <div class="sg"><div><span class="lbl">Form factor</span>${esc(i.form||'—')}</div><div><span class="lbl">Channels</span>${esc(i.channels||'—')}</div><div><span class="lbl">Battery</span>${esc(valueFor(i,'battery_type')||'—')}</div><div><span class="lbl">Warranty</span>${i.warranty?esc(i.warranty)+' yr':'—'}</div></div>
 ${secs}${acc.length?`<div class="sec"><h4>Compatible accessories</h4><div class="acc">${acc.map(a=>`<div><strong>${esc(a.name)}</strong><span>${money(a.price)}</span></div>`).join('')}</div></div>`:''}
 <div class="sec"><h4>Customer-friendly pitch</h4><div class="note">${esc(singlePitch(i))}</div></div><div class="src">Source: ${esc(i.sourceFile||'Catalogue')} · Page ${esc(i.sourcePage||'—')}</div></div>`);
 o.querySelector('#d-cmp').onclick=()=>{toggleCmp(i.id);closeModal()};o.querySelector('#d-pitch').onclick=()=>quickPitch(i.id)}

/* ---------- comparison workspace ---------- */
function genPitch(it){const l=[S.customer?`Dear ${S.customer},`:'Dear Customer,','',(S.pri.length?`Based on your priorities around ${S.pri.join(', ').toLowerCase()}, `:'Based on the options we discussed, ')+'I have shortlisted the following hearing aid options:','',...it.map(i=>`• ${i.name} — ${money(i.price)}${i.warranty?' · '+i.warranty+' year warranty':''}`),'','The main differences are set out in the attached comparison so that you can choose the option best suited to your needs and budget.'];if(S.pri.length)l.push('',`The comparison has been prepared around: ${S.pri.join(', ')}.`);l.push('','Please let me know which option you would like to discuss further.','','Regards');return l.join('\n')}
function priKeys(){const o=[];S.pri.forEach(p=>(PRI[p]||[]).forEach(x=>{if(!o.some(y=>y[0]===x[0]))o.push(x)}));return o.length?o:[['rechargeable','Rechargeable'],['direct_audio_streaming','Direct Audio Streaming'],['handsfree_calling','HandsFree Calling'],['hd_music','HD Music'],['tinnitus_static_therapy','Tinnitus Static Therapy'],['ip68_rating','IP68 Rating']]}
function snapHtml(it){
 const val=(i,k)=>vis(disp(i,k));
 const body=GROUPS.map(g=>{const f=g.f.filter(([k])=>new Set(it.map(i=>disp(i,k))).size>1);return f.length?`<tr class="g"><td colspan="${it.length+1}">${esc(g.label)}</td></tr>`+f.map(([k,l])=>`<tr><td>${esc(l)}</td>${it.map(i=>`<td>${val(i,k)}</td>`).join('')}</tr>`).join(''):''}).join('');
 const det=it.map(i=>{const fit=i.fitting&&i.fitting!=='—'?esc(String(i.fitting).replace(/\s*dB$/i,''))+' dB':'—';return`<div><strong>${esc(i.name)}</strong><b>${money(i.price)}</b><span>${esc(i.form||'—')} · ${esc(chLbl(i.channels)||'—')} · ${fit}${i.warranty?' · '+esc(i.warranty)+' yr warranty':''}</span></div>`}).join('');
 return`<div class="lg"><b>SIGNIA</b><span>Hearing aid comparison${S.customer?' · Prepared for '+esc(S.customer):''}</span></div><h2>Differences between your options</h2><div class="sb">Only the points on which these models differ</div><div class="sprod">${det}</div>${body?`<table><thead><tr><th>Feature</th>${it.map(i=>`<th>${esc(i.name)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`:'<div class="sn-empty">These models have identical specifications and features.</div>'}<div class="fo">Prepared from the current Signia catalogue. Prices and specifications should be reconfirmed before final purchase.</div>`}
function openWorkspace(){const it=items();if(it.length<2)return toast('Select at least two products to compare.','warn');
 const rows=GROUPS.map(g=>{const f=g.f.filter(([k])=>(S.cf==='all'||S.cf===g.id)&&(!S.diff||new Set(it.map(i=>disp(i,k))).size>1));return f.length?`<tr class="g"><td colspan="${it.length+1}">${g.label}</td></tr>`+f.map(([k,l])=>`<tr><td>${esc(l)}</td>${it.map(i=>`<td>${vis(disp(i,k))}</td>`).join('')}</tr>`).join(''):''}).join('');
 const acc=compatAcc(it).slice(0,12);
 const o=openModal(`<div class="mh"><div><div class="mt">Comparison workspace</div><div class="ms">${it.length} products · compare, compose, preview and share</div></div><button class="x">×</button></div>
 <div class="wb"><div class="wt"><button class="on" data-w="compare">Comparison</button><button data-w="pitch">Written pitch</button><button data-w="customer">Customer preview</button></div><div class="wa"><button class="btn" id="w-save">Save</button><button class="btn" id="w-snap">Download image</button><button class="btn p" id="w-share">Share</button></div></div>
 <div class="mb"><div class="wp on" id="w-compare"><div class="ctl"><label>Customer<input type="text" id="w-cust" value="${esc(S.customer)}" placeholder="Optional"></label><span>Priorities${Object.keys(PRI).map(p=>`<button class="chip ${S.pri.includes(p)?'on':''}" data-pri="${p}">${p}</button>`).join('')}</span><label>Section <select id="w-cf"><option value="all">All sections</option>${GROUPS.map(g=>`<option value="${g.id}" ${S.cf===g.id?'selected':''}>${g.label}</option>`).join('')}</select></label><label><input type="checkbox" id="w-diff" ${S.diff?'checked':''}> Differences only</label></div>
 <div class="tw"><table><thead><tr><th>Feature</th>${it.map(i=>`<th>${esc(i.name)}<span class="ph1">${money(i.price)}</span><button class="btn" style="height:26px;margin-top:6px;font-size:11px" data-wrm="${esc(i.id)}">Remove</button></th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="9">No differences found in this section.</td></tr>'}</tbody></table></div>
 <div class="sec" style="margin-top:18px"><h4>Compatible accessories</h4>${acc.length?`<div class="acc">${acc.map(a=>`<div><strong>${esc(a.name)}</strong><span>${money(a.price)} · ${esc(a.form||'Accessory')}</span></div>`).join('')}</div>`:'<span class="ms">No compatible accessories were found in the current compatibility matrix.</span>'}</div></div>
 <div class="wp" id="w-pitch"><div class="pl"><div><div class="sh">Customer message</div><textarea id="w-text"></textarea><div class="acts" style="max-width:520px"><button class="btn" id="p-wa">WhatsApp</button><button class="btn" id="p-em">Email</button><button class="btn" id="p-sh">Short</button><button class="btn" id="p-cp">Copy</button></div></div><aside class="side"><div class="sh">Selected products</div>${it.map(i=>`<div class="i"><strong>${esc(i.name)}</strong><span>${money(i.price)}</span></div>`).join('')}<div class="sh" style="margin-top:16px">Suggested accessories</div>${acc.slice(0,6).map(a=>`<div class="i"><span>${esc(a.name)}</span><span>${money(a.price)}</span></div>`).join('')||'<span class="ms">None matched</span>'}</aside></div></div>
 <div class="wp" id="w-customer"><div class="snap" id="snap"></div></div></div>`,'ws');
 const ta=o.querySelector('#w-text');ta.value=S.pitch||genPitch(it);ta.oninput=()=>{S.pitch=ta.value};
 const redo=()=>{openWorkspace()},setP=t=>{ta.value=S.pitch=t};
 o.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>wtab(b.dataset.w));
 o.querySelector('#w-cust').oninput=e=>{S.customer=e.target.value};
 o.querySelectorAll('[data-pri]').forEach(b=>b.onclick=()=>{const p=b.dataset.pri;S.pri=S.pri.includes(p)?S.pri.filter(x=>x!==p):[...S.pri,p];b.classList.toggle('on');S.pitch='';ta.value=genPitch(it)});
 o.querySelector('#w-cf').onchange=e=>{S.cf=e.target.value;redo()};o.querySelector('#w-diff').onchange=e=>{S.diff=e.target.checked;redo()};
 o.querySelectorAll('[data-wrm]').forEach(b=>b.onclick=()=>{S.cmp=S.cmp.filter(x=>x!==b.dataset.wrm);S.pitch='';render();S.cmp.length<2?closeModal():redo()});
 o.querySelector('#p-wa').onclick=()=>setP(genPitch(it)+'\n\nI can also share the detailed comparison with you.');
 o.querySelector('#p-em').onclick=()=>setP('Subject: Your Signia hearing aid comparison\n\n'+genPitch(it));
 o.querySelector('#p-sh').onclick=()=>setP((S.customer?'Dear '+S.customer+',\n\n':'')+'Options shortlisted for you:\n'+it.map(i=>`• ${i.name} — ${money(i.price)}`).join('\n')+'\n\nA side-by-side comparison is attached.');
 o.querySelector('#p-cp').onclick=()=>navigator.clipboard?.writeText(ta.value).then(()=>toast('Message copied.','success'));
 o.querySelector('#w-save').onclick=saveCmp;o.querySelector('#w-snap').onclick=snapshot;o.querySelector('#w-share').onclick=share}
function wtab(t){document.querySelectorAll('.wt button').forEach(b=>b.classList.toggle('on',b.dataset.w===t));document.querySelectorAll('.wp').forEach(p=>p.classList.toggle('on',p.id==='w-'+t));if(t==='customer')$('snap').innerHTML=snapHtml(items())}
function localSave(x){let a=[];try{a=JSON.parse(localStorage.getItem(LOCAL_CMP)||'[]')}catch(_){}a=[x,...a.filter(y=>y.id!==x.id)].slice(0,50);try{localStorage.setItem(LOCAL_CMP,JSON.stringify(a))}catch(_){}}
async function saveCmp(){const it=items();if(it.length<2)return;const payload={customerName:S.customer,user:'',products:it.map(i=>({id:i.id,name:i.name,price:i.price,series:i.series,form:i.form,channels:i.channels,fitting:i.fitting,warranty:i.warranty})),pitch:{text:S.pitch||genPitch(it),priorities:S.pri},snapshot:{selectedFeatures:priKeys().map(x=>x[0]),createdFromVersion:S.version}};
 try{const r=await apiPost({action:'saveComparison',payload});localSave({...payload,id:r.id,createdAt:r.createdAt,dataVersion:r.version});toast('Comparison saved · '+r.id,'success')}catch(e){const id='LOCAL-'+Date.now();localSave({...payload,id,createdAt:new Date().toISOString(),dataVersion:S.version});toast('Backend unavailable. Saved on this device · '+id,'warn')}}
async function snapshot(){wtab('customer');const t=$('snap');if(window.html2canvas){try{const c=await html2canvas(t,{scale:2,backgroundColor:'#fff',useCORS:true});const a=document.createElement('a');a.download='Signia-Comparison-'+Date.now()+'.png';a.href=c.toDataURL('image/png');a.click();return toast('Image downloaded.','success')}catch(_){toast('Image export failed. Use Print / Save as PDF.','warn')}}window.print()}
async function share(){wtab('customer');const t=$('snap');try{if(window.html2canvas&&navigator.share){const c=await html2canvas(t,{scale:2,backgroundColor:'#fff',useCORS:true}),b=await new Promise(r=>c.toBlob(r,'image/png')),f=new File([b],'Signia-Comparison.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))return void await navigator.share({title:'Signia hearing aid comparison',files:[f]})}}catch(e){if(e.name==='AbortError')return}window.open('https://wa.me/?text='+encodeURIComponent(S.pitch||genPitch(items())),'_blank','noopener')}
async function showSaved(){let list=[],local=false;try{list=(await apiGet('comparisons')).comparisons||[]}catch(_){local=true;try{list=JSON.parse(localStorage.getItem(LOCAL_CMP)||'[]').map(x=>({...x,productCount:(x.products||[]).length}))}catch(_){}}
 const o=openModal(`<div class="mh"><div><div class="mt">Saved comparisons</div><div class="ms">${list.length} record${list.length===1?'':'s'}${local?' · stored on this device':''}</div></div><button class="x">×</button></div><div class="mb">${list.map(x=>`<button class="saved" data-sv="${esc(x.id)}"><div><strong>${esc(x.customerName||'Unnamed customer')}</strong><span>${esc(x.id)} · ${esc(x.productCount)} products</span></div><small>${esc(fmtDate(x.createdAt))}</small></button>`).join('')||'<div class="empty">No saved comparisons yet.</div>'}</div>`);
 o.querySelectorAll('[data-sv]').forEach(b=>b.onclick=async()=>{try{let r=local?JSON.parse(localStorage.getItem(LOCAL_CMP)||'[]').find(x=>x.id===b.dataset.sv):await apiGet('comparison',{id:b.dataset.sv});S.cmp=(r.products||[]).map(p=>p.id).filter(x=>S.all.some(d=>d.id===x));S.customer=r.customerName||'';S.pri=r.pitch?.priorities||[];S.pitch=r.pitch?.text||'';render();S.cmp.length>=2?openWorkspace():(closeModal(),toast('Some saved products are no longer in the catalogue.','warn'))}catch(_){toast('Unable to open the saved comparison.','warn')}})}

/* ---------- advisor & objections ---------- */
function renderAdvisor(){const B=['Any','Under ₹2L','₹2L–₹4L','₹4L–₹8L','Above ₹8L'];
 const ok=p=>S.budget==='Any'||(S.budget===B[1]?p<2e5:S.budget===B[2]?p>=2e5&&p<=4e5:S.budget===B[3]?p>4e5&&p<=8e5:p>8e5);
 const res=S.devices.filter(d=>ok(d.price||0)).map(d=>{const m=S.pri.filter(p=>p==='Discreet'?/ITE|ITC|CIC|IIC|Silk|Insio/i.test((d.form||'')+d.name):(PRI[p]||[]).some(([k])=>disp(d,k)==='✓'));return{d,m}}).filter(x=>!S.pri.length||x.m.length).sort((a,b)=>b.m.length-a.m.length).slice(0,12);
 $('count').textContent='';$('content').innerHTML=`<div class="reco"><div class="panel"><div class="sh">Customer priorities</div>${Object.keys(PRI).map(p=>`<button class="chip ${S.pri.includes(p)?'on':''}" data-ap="${p}">${p}</button>`).join('')}<div class="sh" style="margin-top:14px">Budget</div>${B.map(b=>`<button class="chip ${S.budget===b?'on':''}" data-ab="${b}">${b}</button>`).join('')}</div><div class="count"><b>${res.length}</b> matching models${S.pri.length?', ranked by number of priorities met':''}</div><div class="grid">${res.map(x=>card(x.d,x.m.length?x.m.map(p=>`<span>${p}</span>`).join(''):'')).join('')}</div></div>`;
 $('content').querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{const p=b.dataset.ap;S.pri=S.pri.includes(p)?S.pri.filter(x=>x!==p):[...S.pri,p];S.pitch='';renderAdvisor()});$('content').querySelectorAll('[data-ab]').forEach(b=>b.onclick=()=>{S.budget=b.dataset.ab;renderAdvisor()});bind($('content'))}
function renderObj(){$('count').textContent='';$('content').innerHTML=`<div class="reco"><div class="panel"><div class="ms">Conversation guides grounded in the customer’s actual concern. Adapt the wording naturally; do not read verbatim.</div></div>${OBJ.map((o,i)=>`<details><summary>${esc(o[0])}</summary><div class="a">${esc(o[1])}<div style="margin-top:10px"><button class="btn" data-ob="${i}">Copy guidance</button></div></div></details>`).join('')}</div>`;$('content').querySelectorAll('[data-ob]').forEach(b=>b.onclick=()=>navigator.clipboard?.writeText(OBJ[+b.dataset.ob][1]).then(()=>toast('Guidance copied.','success')))}

function renderHero(){const dv=S.tab==='devices',sel=$('f-series'),c={};(dv?S.devices:S.accessories).forEach(x=>{const g=grp(x)||'Other';c[g]=(c[g]||0)+1});const k=sel.value;sel.length=1;sel.options[0].text=dv?'All series':'All groups';Object.keys(c).sort((a,b)=>c[b]-c[a]).forEach(g=>sel.add(new Option(seriesLabel(g)+' ('+c[g]+')',g)));sel.value=c[k]?k:'';$('plat').style.display='none'}
const skel=()=>'<div class="og">'+'<div class="oc sk"></div>'.repeat(8)+'</div>';
/* ---------- shell ---------- */
const TITLES={devices:['Hearing Aids','Search, filter and shortlist the current Signia range'],accessories:['Accessories','Chargers, streamers, remotes and related items'],recommend:['Needs Advisor','Match the range to the customer’s priorities and budget'],objections:['Objection Handling','Structured responses for common customer concerns']};
function render(){const cat=S.tab==='devices'||S.tab==='accessories';[$('filters'),$('cbar')].forEach(e=>e.style.display=cat?'':'none');$('f-form').style.display=S.tab==='accessories'?'none':'';$('title').textContent=TITLES[S.tab][0];$('sub').textContent=TITLES[S.tab][1];renderMetrics();renderHero();if(S.tab==='recommend')renderAdvisor();else if(S.tab==='objections')renderObj();else renderCatalog();renderTray()}
async function bgImages(p){const m=p&&p.meta&&p.meta.images;if(!m||!(m.stale||m.pending>0))return;const K='signia_img_sync';let last=0;try{last=Number(localStorage.getItem(K)||0)}catch(_){}
 if(Date.now()-last<20*60*1000)return;try{localStorage.setItem(K,String(Date.now()))}catch(_){}
 try{const r=await fetchJson(SHEET_URL+'?'+new URLSearchParams({action:'syncimages'}),{},90000);
  if(r&&r.changed){const f=await apiGet('full');if(f&&f.ok!==false){['devices','accessories','featureRecords','compatibility'].forEach(k=>{if(!Array.isArray(f[k]))f[k]=[]});build(f);try{localStorage.setItem(CACHE_KEY,JSON.stringify(f))}catch(_){}render()}}}catch(_){}}
async function loadData(force=false){setStatus('','Connecting');if(!S.all.length)$('content').innerHTML=skel();const cached=cacheLoad();
 try{if(!force&&cached){try{const v=await apiGet('version');if(v&&v.version&&cached.version===v.version){build(cached);setStatus('live','Up to date · sheet last edited '+fmtDate(cached.version));render();bgImages(cached);return}}catch(_){}}
  setStatus('','Loading catalogue');const f=await apiGet('full');if(!f||f.ok===false)throw new Error((f&&f.error)||'The backend returned no catalogue data.');['devices','accessories','featureRecords','compatibility'].forEach(k=>{if(!Array.isArray(f[k]))f[k]=[]});build(f);console.info('[Signia] backend payload',{devices:S.devices.length,accessories:S.accessories.length,features:S.features.length,compat:S.compat.length,meta:f.meta});if(f.meta&&f.meta.deviceCount&&!S.devices.length)toast('Backend returned devices but none were recognised as hearing aids. Check platform names.','warn');try{localStorage.setItem(CACHE_KEY,JSON.stringify(f))}catch(_){}setStatus('live','Up to date · sheet last edited '+fmtDate(f.version||f.generatedAt));render();bgImages(f)}
 catch(e){if(cached&&Array.isArray(cached.devices)){build(cached);setStatus('cached','Cached · backend unavailable');render();return toast('Live catalogue unavailable. Showing the last valid copy.','warn')}
  setStatus('error','Data error');$('content').innerHTML=`<div class="empty"><p>${esc(e.message||'Unable to load the catalogue.')}</p>Checks: (1) the Web App is deployed with access set to <b>Anyone</b>, (2) the deployment points to the latest version, (3) the script is bound to the catalogue spreadsheet.<br><br><a class="btn" href="${esc(SHEET_URL)}?action=health" target="_blank" rel="noopener">Open backend health check</a> <button class="btn" onclick="loadData(true)">Retry</button></div>`}}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.tab=b.dataset.tab;window._plat='';$('f-series').length=1;$('f-series').value='';$('q').value='';render()});
['q','f-series','f-form','f-price','f-war','f-sort'].forEach(id=>$(id).oninput=renderCatalog);
$('v-grid').onclick=()=>{S.view='grid';$('v-grid').classList.add('on');$('v-list').classList.remove('on');renderCatalog()};
$('v-list').onclick=()=>{S.view='list';$('v-list').classList.add('on');$('v-grid').classList.remove('on');renderCatalog()};
$('tray-go').onclick=openWorkspace;$('tray-clear').onclick=()=>{S.cmp=[];S.pitch='';render()};$('btn-refresh').onclick=()=>loadData(true);$('btn-saved').onclick=showSaved;
loadData();
